name: Build TeleHack

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct download URL of a DECRYPTED Telegram .ipa (optional). If set, a patched IPA is produced."
        required: false
        default: ""
      bundle_id:
        description: "Bundle ID of the patched app. A different ID lets it be installed next to the official Telegram. Leave empty to keep the original."
        required: false
        default: "ph.telegra.Telegraph.telehack"
      app_name:
        description: "Name shown on the Home Screen"
        required: false
        default: "TeleHack"
      remove_extensions:
        description: "Remove app extensions (share, widgets, notifications). Recommended for free Apple IDs (fewer App IDs) and side-by-side install."
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v5
        with:
          path: telehack

      - name: Install Theos (Linux toolchain + iOS SDK)
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential fakeroot rsync curl perl git xz-utils zstd unzip
          git clone --recursive --depth 1 --shallow-submodules https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain"
          curl -fsSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJ -C "$THEOS/toolchain"
          curl -fsSL https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP"/sdks-master/*.sdk "$THEOS/sdks/"
          ls "$THEOS/sdks"
          if ! command -v ldid >/dev/null; then
            sudo curl -fsSL -o /usr/local/bin/ldid \
              https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
            sudo chmod +x /usr/local/bin/ldid
          fi
          ls "$THEOS/toolchain/linux/iphone/bin" || true

      - name: Build rootless .deb (Dopamine / palera1n)
        working-directory: telehack
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mkdir -p ../out
          cp packages/*.deb ../out/
          cp .theos/obj/TeleHack.dylib ../out/TeleHack.dylib
          file ../out/TeleHack.dylib || true
          echo "Linked libraries:"
          strings -a ../out/TeleHack.dylib | grep -E '^(/System|/usr/lib|/Library|@rpath)' | sort -u
          if strings -a ../out/TeleHack.dylib | grep -q CydiaSubstrate; then
            echo "::warning::TeleHack.dylib links CydiaSubstrate; IPA injection will need it bundled"
          fi

      - name: Build rootful .deb (checkra1n / unc0ver)
        working-directory: telehack
        run: |
          rm -rf packages
          make clean package FINALPACKAGE=1
          cp packages/*.deb ../out/

      - name: Upload tweak
        uses: actions/upload-artifact@v6
        with:
          name: TeleHack-tweak
          path: out/

      - name: Inject into IPA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ipa_url != '' }}
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          APP_NAME: ${{ inputs.app_name }}
          REMOVE_EXT: ${{ inputs.remove_extensions }}
        run: |
          echo "::add-mask::$IPA_URL"
          pip3 install --break-system-packages --force-reinstall https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          mkdir -p ipa
          curl -fL --retry 3 -o ipa/Telegram.ipa "$IPA_URL"
          args=(-i ipa/Telegram.ipa -o ipa/Telegram-TeleHack.ipa -u -f out/TeleHack.dylib)
          [ -n "$BUNDLE_ID" ] && args+=(-b "$BUNDLE_ID")
          [ -n "$APP_NAME" ] && args+=(-n "$APP_NAME")
          [ "$REMOVE_EXT" = "true" ] && args+=(-e)
          cyan "${args[@]}"

      - name: Upload patched IPA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ipa_url != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: Telegram-TeleHack-ipa
          path: ipa/Telegram-TeleHack.ipa
          retention-days: 3
